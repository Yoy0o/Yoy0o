# Daily snapshot of traffic (views / clones / referrers / paths), growth
# (stars / forks) and downloads (release assets, npm) for Yoy0o's public repos.
# GitHub keeps traffic for 14 days only, so each run merges into
# stats/data/history.json, then re-renders the charts and the README section.
#
# Requires secret STATS_TOKEN — see stats/README.md.
name: Repo stats

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test stats/stats.test.mjs
      - name: Collect
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::warning::STATS_TOKEN secret is not configured; skipping collection."
            exit 0
          fi
          node stats/collect.mjs
      - name: Render
        run: node stats/render.mjs
      - name: Commit
        run: |
          git add README.md stats/data stats/charts
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stats): 更新仓库数据 $(date -u +%F)"
          git pull --rebase
          git push
